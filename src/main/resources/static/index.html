<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B2B CRM Pipeline</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">B2B CRM</p>
          <h1 data-i18n="appTitle">Deal Pipeline</h1>
        </div>
        <div class="topbar-actions">
          <label class="language-picker">
            <span data-i18n="language">Language</span>
            <select id="languageSelect" aria-label="Language">
              <option value="en">English</option>
              <option value="ko">한국어</option>
              <option value="ja">日本語</option>
            </select>
          </label>
          <button class="primary" id="newDealButton" type="button" data-i18n="newDeal">New Deal</button>
        </div>
      </header>

      <section class="user-panel" aria-label="Current user" data-i18n-aria-label="currentUser">
        <label>
          <span data-i18n="user">User</span>
          <input id="currentUsername" placeholder="Admin" data-i18n-placeholder="adminPlaceholder" value="Admin" maxlength="60" />
        </label>
        <label>
          <span data-i18n="password">Password</span>
          <input id="currentPassword" placeholder="Admin" data-i18n-placeholder="adminPlaceholder" value="Admin" maxlength="120" type="password" />
        </label>
        <button class="ghost" id="createUserButton" type="button" data-i18n="createUser">Create User</button>
      </section>

      <section class="metrics" aria-label="Pipeline summary" data-i18n-aria-label="pipelineSummary">
        <div>
          <span id="totalDeals">0</span>
          <p data-i18n="totalDeals">Total deals</p>
        </div>
        <div>
          <span id="totalValue">$0</span>
          <p data-i18n="pipelineValue">Pipeline value</p>
        </div>
        <div>
          <span id="weightedValue">$0</span>
          <p data-i18n="weightedForecast">Weighted forecast</p>
        </div>
        <div>
          <span id="activeAccounts">0</span>
          <p data-i18n="activeAccounts">Active accounts</p>
        </div>
      </section>

      <section class="controls" aria-label="Pipeline controls" data-i18n-aria-label="pipelineControls">
        <label class="search">
          <span data-i18n="search">Search</span>
          <input id="searchInput" type="search" placeholder="Company, owner, next action" data-i18n-placeholder="searchPlaceholder" />
        </label>
        <label>
          <span data-i18n="stage">Stage</span>
          <select id="stageFilter">
            <option value="all" data-i18n="allStages">All stages</option>
          </select>
        </label>
        <label>
          <span data-i18n="priority">Priority</span>
          <select id="priorityFilter">
            <option value="all" data-i18n="allPriorities">All priorities</option>
            <option value="High" data-priority-option="HIGH">High</option>
            <option value="Medium" data-priority-option="MEDIUM">Medium</option>
            <option value="Low" data-priority-option="LOW">Low</option>
          </select>
        </label>
      </section>

      <section class="pipeline" id="pipeline" aria-label="Deal pipeline" data-i18n-aria-label="dealPipeline"></section>
    </main>

    <dialog id="dealDialog" aria-labelledby="dialogTitle">
      <form method="dialog" class="deal-form" id="dealForm">
        <div class="dialog-head">
          <div>
            <p class="eyebrow" data-i18n="opportunity">Opportunity</p>
            <h2 id="dialogTitle">New Deal</h2>
          </div>
          <button class="icon-button" id="closeDialogButton" type="button" aria-label="Close" data-i18n-aria-label="close">x</button>
        </div>

        <input id="dealId" type="hidden" />

        <div class="form-grid">
          <label>
            <span data-i18n="company">Company</span>
            <input id="company" required maxlength="80" />
          </label>
          <label>
            <span data-i18n="contact">Contact</span>
            <input id="contact" required maxlength="80" />
          </label>
          <label>
            <span data-i18n="owner">Owner</span>
            <input id="owner" required maxlength="60" />
          </label>
          <label>
            <span data-i18n="stage">Stage</span>
            <select id="stage" required></select>
          </label>
          <label>
            <span data-i18n="value">Value</span>
            <input id="value" required min="0" step="1000" type="number" />
          </label>
          <label>
            <span data-i18n="probability">Probability</span>
            <input id="probability" required min="0" max="100" step="5" type="number" />
          </label>
          <label>
            <span data-i18n="priority">Priority</span>
            <select id="priority" required>
              <option value="HIGH" data-priority-option="HIGH">High</option>
              <option value="MEDIUM" data-priority-option="MEDIUM">Medium</option>
              <option value="LOW" data-priority-option="LOW">Low</option>
            </select>
          </label>
          <label>
            <span data-i18n="closeDate">Close date</span>
            <input id="closeDate" required type="date" />
          </label>
          <label>
            <span data-i18n="opportunityLocation">Opportunity location</span>
            <input id="opportunityLocation" maxlength="120" />
          </label>
          <label>
            <span data-i18n="expectedItems">Items or materials</span>
            <input id="expectedItems" maxlength="180" />
          </label>
        </div>

        <label>
          <span data-i18n="nextAction">Next action</span>
          <textarea id="nextAction" required rows="3" maxlength="180"></textarea>
        </label>

        <div class="form-actions">
          <button class="ghost danger" id="deleteButton" type="button" data-i18n="delete">Delete</button>
          <div>
            <button class="ghost" id="cancelButton" type="button" data-i18n="cancel">Cancel</button>
            <button class="primary" type="submit" data-i18n="saveDeal">Save Deal</button>
          </div>
        </div>
      </form>
    </dialog>

    <template id="stageTemplate">
      <article class="stage-column">
        <header>
          <div>
            <h2></h2>
            <p></p>
          </div>
          <span class="stage-count"></span>
        </header>
        <div class="deal-list"></div>
      </article>
    </template>

    <template id="dealTemplate">
      <article class="deal-card">
        <button class="deal-main" type="button">
          <span class="deal-title"></span>
          <span class="deal-meta"></span>
          <span class="deal-action"></span>
        </button>
        <footer>
          <span class="priority"></span>
          <span class="value"></span>
        </footer>
        <div class="move-row">
          <button class="move-button" data-direction="back" type="button"></button>
          <button class="move-button" data-direction="next" type="button"></button>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
