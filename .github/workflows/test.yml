name: CRM test suite

on:
  push:
    branches: [main, master, "260821"]
  pull_request:
    branches: [main, master, "260821"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: playwright/requirements.txt
      - name: Install Python and Playwright dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r playwright/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Install Allure CLI
        env:
          ALLURE_VERSION: 2.44.1
        run: |
          curl --fail --location --output allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar --extract --gzip --file allure.tgz
          echo "$GITHUB_WORKSPACE/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"
          allure --version
      - name: Run CRM tests
        env:
          CRM_BASE_URL: http://localhost:8081
        run: |
          mvn spring-boot:run > spring-boot.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$CRM_BASE_URL" > /dev/null; then
              echo "Spring Boot is ready."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Spring Boot did not become ready."
              cat spring-boot.log
              exit 1
            fi
            echo "Waiting for Spring Boot ($attempt/30)..."
            sleep 2
          done
          test_status=0
          python -m pytest --alluredir=allure-results || test_status=$?
          if [ "$test_status" -ne 0 ]; then
            echo "pytest failed. Spring Boot log follows:"
            cat spring-boot.log
          fi
          exit "$test_status"
      - name: Generate Allure HTML report
        if: always() && hashFiles('allure-results/**') != ''
        run: allure generate allure-results --clean -o allure-report
      - name: Upload Allure raw results
        if: always() && hashFiles('allure-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: error
      - name: Upload Spring Boot log
        if: always() && hashFiles('spring-boot.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-log
          path: spring-boot.log
          if-no-files-found: error
      - name: Upload Allure HTML report
        if: success() && hashFiles('allure-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Download Allure HTML report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
